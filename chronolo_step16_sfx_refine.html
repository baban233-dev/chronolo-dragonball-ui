<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHRONOLO｜Manga UI STEP3-6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Yusei+Magic&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Yusei+Magic&display=swap');

:root{
  --ink:#06142b;
  --navy:#062b61;
  --blue:#087bd9;
  --sky:#27c7ff;
  --gold:#ffd21a;
  --orange:#ff8a00;
  --red:#ef2617;
  --cream:#fff8df;
  --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07101f;color:#fff}
body{
  font-family:"Noto Sans JP",sans-serif;
  padding:0;
}
.app{
  width:min(1500px,100%);
  margin:auto;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,rgba(0,145,255,.12),transparent 32%),
    repeating-linear-gradient(135deg,#06142a 0 16px,#081b37 16px 19px);
  border:0;
}
.manga{font-family:"Yusei Magic","Arial Black",sans-serif}

/* ===== CHRONOLO header ===== */
header{
  height:88px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:7px 18px;
  background:
    linear-gradient(115deg,#03142f 0%,#07559b 48%,#02142d 100%);
  border-bottom:6px solid #ffb900;
  position:relative;
  z-index:20;
  box-shadow:0 5px 0 #000;
}
header:before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:27%;
  background:repeating-linear-gradient(-22deg,transparent 0 15px,rgba(255,255,255,.09) 16px 19px);
}
.logo-orb{
  position:relative;z-index:1;
  width:61px;height:61px;flex:none;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 34% 26%,#fff7ad 0 8%,#ffdb27 20%,#ff9c00 49%,#ed3500 80%,#a80b00 100%);
  border:4px solid #090909;
  box-shadow:0 0 0 3px #ffd52a, inset -8px -8px 14px #8c1700,5px 5px 0 #000;
  color:#d91d00;font:900 13px Arial;letter-spacing:-3px;
}
.brand-wrap{position:relative;z-index:1}
.brand{
  font:900 37px/1 "Yusei Magic";
  letter-spacing:1px;
  color:#ffb31b;
  -webkit-text-stroke:2px #050b16;
  text-shadow:3px 3px 0 #fff14a,6px 6px 0 #03152e;
}
.brand-sub{
  font-size:11px;color:#fff;font-weight:900;
  letter-spacing:2px;text-shadow:2px 2px #000;
  margin-top:3px;
}
nav{
  margin-left:auto;display:flex;align-items:stretch;height:100%;gap:0;
  position:relative;z-index:2;
}
nav a{
  min-width:118px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  color:#fff;text-decoration:none;font-weight:900;font-size:16px;
  padding:0 14px;
  border-left:3px solid #06203e;
  border-right:1px solid #1599ed;
  background:linear-gradient(180deg,#0a4681,#062552);
  transform:skew(-7deg);
  text-shadow:2px 2px #000;
}
nav a>*{transform:skew(7deg)}
nav a.active{
  background:linear-gradient(180deg,#ffdc32,#ff8a00);
  color:#07152b;
  border-color:#050505;
  box-shadow:inset 0 -7px 0 #e05200,0 0 0 3px #ffd52b;
  text-shadow:none;
}

/* ===== hero ===== */
.hero{
  height:545px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 80% 55%,#fff 0 3%,transparent 4%),
    linear-gradient(180deg,#0d8be8 0%,#62d9ff 58%,#eefbff 100%);
  border-bottom:8px solid #07152a;
}
.hero:before{
  content:"";
  position:absolute;inset:-30%;
  background:
    repeating-linear-gradient(112deg,transparent 0 27px,rgba(255,255,255,.65) 29px 34px,transparent 36px 74px);
  transform:rotate(-5deg);
  opacity:.55;
}
.hero:after{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:28%;
  background:linear-gradient(transparent,rgba(2,21,50,.72));
  z-index:2;
}
.character{
  position:absolute;
  left:-1%;
  bottom:-185px;
  width:66%;
  height:850px;
  object-fit:cover;
  object-position:center 19%;
  filter:saturate(1.18) contrast(1.1) drop-shadow(14px 17px 0 rgba(0,0,0,.42));
  z-index:4;
}
.energy{
  position:absolute;inset:0;z-index:3;pointer-events:none;
}
.energy i{
  position:absolute;height:8px;
  background:linear-gradient(90deg,transparent,#fff,#ffe32b,#ff8500,transparent);
  filter:drop-shadow(0 0 7px #fff);
  transform:rotate(-18deg);
}
.energy i:nth-child(1){width:42%;left:-4%;top:25%}
.energy i:nth-child(2){width:34%;left:40%;top:9%;transform:rotate(15deg)}
.energy i:nth-child(3){width:39%;left:65%;top:29%;transform:rotate(-13deg)}
.energy i:nth-child(4){width:30%;left:58%;top:78%;transform:rotate(18deg)}

.mode-tag{
  position:absolute;left:18px;top:17px;z-index:9;
  padding:13px 42px 13px 25px;
  color:#ffd522;
  background:#050d1c;
  border:5px solid #000;
  clip-path:polygon(0 7%,8% 0,100% 5%,93% 100%,0 91%);
  font:900 39px/1 "Yusei Magic";
  -webkit-text-stroke:2px #000;
  text-shadow:3px 3px 0 #fff000,6px 6px 0 #000;
  transform:rotate(-5deg);
}
.mode-tag span{
  display:block;
  margin-top:4px;
  font:900 12px Arial,sans-serif;
  color:#fff;
  letter-spacing:3px;
  -webkit-text-stroke:0;
  text-shadow:2px 2px #000;
  text-align:center;
}

.hero-copy{
  position:absolute;right:3.5%;top:68px;width:38%;
  z-index:8;
}
.bubble{
  position:relative;
  background:#fff;
  color:#080d15;
  border:7px solid #000;
  padding:28px 30px 27px;
  box-shadow:11px 11px 0 #0b64b7,17px 17px 0 #000;
  clip-path:polygon(0 9%,7% 0,86% 3%,100% 13%,96% 81%,87% 100%,11% 94%,0 82%,4% 45%);
  font:900 33px/1.35 "Yusei Magic";
  text-align:center;
}
.bubble:after{
  content:"";
  position:absolute;left:-29px;bottom:37px;
  border-width:18px 34px 18px 0;border-style:solid;
  border-color:transparent #000 transparent transparent;
  transform:rotate(7deg);
}
.hero-sfx{
  margin-top:22px;margin-right:4px;text-align:right;
  font:900 75px/1 "Yusei Magic";
  color:#ff260e;
  -webkit-text-stroke:4px #000;
  text-shadow:6px 6px 0 #ffd52a,11px 11px 0 #000;
  transform:rotate(-7deg);
}
.hero-status{
  position:absolute;right:24px;bottom:18px;z-index:9;
  display:flex;align-items:center;gap:8px;
  background:#04152e;border:3px solid #fff;border-radius:6px;
  padding:7px 12px;font:900 11px Arial;
  box-shadow:4px 4px 0 #000;
}
.pulse{
  width:10px;height:10px;border-radius:50%;
  background:#1dff65;box-shadow:0 0 12px #1dff65;
}

/* ===== feed header ===== */
.feed{
  padding:0 18px 30px;
  background:
    repeating-linear-gradient(135deg,#06152d 0 22px,#071c3b 22px 25px);
}
.feed-head{
  min-height:92px;
  margin:0 -18px;
  padding:10px 28px;
  display:flex;align-items:center;gap:13px;
  background:
    linear-gradient(105deg,#03152f 0%,#074b88 55%,#061a38 100%);
  border:5px solid #000;
  border-top:0;
  border-bottom:5px solid #ffb000;
  position:relative;overflow:hidden;
}
.feed-head:after{
  content:"";
  position:absolute;right:-80px;top:-20px;
  width:420px;height:100px;
  background:#ffad00;
  transform:skew(-25deg);
  box-shadow:0 0 0 6px #000;
}
.feed-orb{
  position:relative;z-index:2;
  width:58px;height:58px;flex:none;border-radius:50%;
  background:radial-gradient(circle,#fff29b 0 8%,#ffd623 12% 32%,#ff8d00 35% 66%,#e72d00 70% 100%);
  border:4px solid #000;box-shadow:0 0 0 3px #ffd328,5px 5px 0 #000;
}
.feed-title{
  position:relative;z-index:2;
  font:900 46px/1 "Yusei Magic";
  color:#ffb300;
  -webkit-text-stroke:2px #000;
  text-shadow:4px 4px 0 #ffe93a,7px 7px 0 #000;
  transform:skew(-8deg);
}
.count{
  position:relative;z-index:2;
  background:linear-gradient(#fff,#ffdf45);
  color:#08152a;
  border:4px solid #000;border-radius:20px;
  padding:5px 17px;
  font:900 21px Arial;
  box-shadow:4px 4px 0 #e95400;
}
.toggle{
  position:relative;z-index:2;
  font-size:13px;font-weight:900;
  margin-left:16px;color:#fff;
}
.updated{
  position:relative;z-index:2;
  margin-left:auto;font:900 12px monospace;color:#fff;
}

/* ===== feed cards: reference-like bright comic cards ===== */
.feed-item{
  position:relative;
  margin:15px 0 0;
  min-height:116px;
  display:grid;
  grid-template-columns:105px 155px 1fr 150px;
  gap:10px;
  align-items:center;
  padding:10px 15px 10px 9px;
  color:#07111e;
  background:linear-gradient(110deg,#fff 0%,#fff7de 65%,#ffe7cc 100%);
  border:5px solid #000;
  border-radius:13px;
  box-shadow:7px 7px 0 #000;
  overflow:hidden;
}
.feed-item:after{
  content:"";
  position:absolute;right:-4px;top:0;bottom:0;width:18%;
  background:repeating-linear-gradient(-35deg,transparent 0 12px,rgba(255,255,255,.7) 13px 17px);
  opacity:.9;
}
.feed-item.warn{
  border-color:#000;
  box-shadow:7px 7px 0 #000,0 0 0 3px #ef2817;
}
.feed-item.caution{
  box-shadow:7px 7px 0 #000,0 0 0 3px #ffbd00;
}
.badge{
  width:91px;height:91px;
  border-radius:50%;
  display:grid;place-items:center;
  border:5px solid #000;
  box-shadow:
    inset -9px -10px 0 rgba(0,0,0,.18),
    5px 5px 0 #000,
    0 0 0 3px #fff,
    0 0 0 6px #050505;
  font:900 39px/1 "Yusei Magic";
  position:relative;z-index:3;
  isolation:isolate;
}
.badge:before{
  content:"";
  position:absolute;
  inset:-13px;
  z-index:-1;
  background:
    repeating-conic-gradient(
      from 0deg,
      transparent 0deg 9deg,
      rgba(0,0,0,.82) 9deg 11deg,
      transparent 11deg 20deg
    );
  -webkit-mask:radial-gradient(circle,transparent 0 56%,#000 57% 72%,transparent 73%);
  mask:radial-gradient(circle,transparent 0 56%,#000 57% 72%,transparent 73%);
  transform:rotate(7deg);
  opacity:.9;
}
.badge:after{
  content:"";
  position:absolute;
  left:12%;
  top:8%;
  width:34%;
  height:20%;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  transform:rotate(-20deg);
  filter:blur(2px);
}
.badge.warn{
  background:radial-gradient(circle at 32% 25%,#ffb08d 0 7%,#ff7657 20%,#ed2b16 58%,#a70b00 100%);
  color:#fff;
  text-shadow:3px 3px #8b0900;
  box-shadow:
    inset -9px -10px 0 rgba(0,0,0,.18),
    5px 5px 0 #000,
    0 0 0 3px #fff,
    0 0 0 6px #050505,
    0 0 20px rgba(255,40,20,.8);
}
.badge.caution{
  background:radial-gradient(circle at 32% 25%,#ffffd0 0 7%,#fff87c 20%,#ffd522 45%,#f08b00 100%);
  color:#080d16;
  text-shadow:2px 2px #fff;
  box-shadow:
    inset -9px -10px 0 rgba(0,0,0,.15),
    5px 5px 0 #000,
    0 0 0 3px #fff,
    0 0 0 6px #050505,
    0 0 20px rgba(255,190,0,.75);
}
.pill{
  display:inline-block;
  position:relative;z-index:3;
  padding:7px 13px;
  color:#fff;
  border:3px solid #000;
  border-radius:4px;
  font-size:13px;font-weight:900;
  box-shadow:4px 4px 0 #000;
}
.pill.warn{background:linear-gradient(90deg,#ed2115,#ff3f18)}
.pill.caution{background:linear-gradient(90deg,#f28a00,#ffb700);color:#111}
.item-title{
  position:relative;z-index:3;
  font-size:21px;font-weight:900;
  margin-top:8px;
  line-height:1.25;
}
.item-sub{
  position:relative;z-index:3;
  font-size:12px;font-weight:700;
  margin-top:7px;color:#25384e;
}
.flag{color:#d92317;font-weight:900}
.item-right{
  position:relative;z-index:4;
  align-self:stretch;
  display:flex;flex-direction:column;
  justify-content:center;align-items:flex-end;
}
.sfx{
  font:900 36px/1 "Yusei Magic";
  color:#111;
  -webkit-text-stroke:2px #000;
  text-shadow:4px 4px 0 #ffd51f;
  transform:rotate(-7deg);
  white-space:nowrap;
}
.warn .sfx{color:#ed1e12;text-shadow:4px 4px 0 #fff,7px 7px 0 #000}
.caution .sfx{color:#087bd9;text-shadow:4px 4px 0 #fff,7px 7px 0 #000}
.item-time{
  margin-top:11px;
  font:900 13px monospace;color:#06152c;
}

/* ===== level 2-5 style banner ===== */
.level-strip{
  margin-top:16px;
  min-height:104px;
  display:grid;
  grid-template-columns:205px 1fr 125px;
  align-items:center;gap:12px;
  padding:10px 13px;
  background:linear-gradient(110deg,#fff 0%,#fff5df 70%,#ffd6c6);
  color:#111;
  border:5px solid #000;border-radius:12px;
  box-shadow:7px 7px 0 #000;
  position:relative;overflow:hidden;
}
.level-strip:before{
  content:"";
  position:absolute;left:-15px;top:-10px;bottom:-10px;width:245px;
  background:linear-gradient(115deg,#ff2815,#ff8d00);
  clip-path:polygon(0 0,100% 0,83% 100%,0 100%);
  border-right:5px solid #000;
}
.level-label{
  position:relative;z-index:2;
  font:900 24px/1.15 "Yusei Magic";
  color:#fff;
  -webkit-text-stroke:2px #000;
  text-shadow:3px 3px #000;
}
.level-label small{
  display:block;font:900 11px Arial;color:#fff;
  -webkit-text-stroke:0;margin-top:7px;
}
.level-body{position:relative;z-index:2;font-weight:900;font-size:16px;line-height:1.4}
.level-body span{display:block;font-size:12px;margin-top:5px}
.level-sfx{
  position:relative;z-index:3;
  font:900 40px/1 "Yusei Magic";
  color:#ed2012;
  -webkit-text-stroke:2px #000;
  text-shadow:4px 4px 0 #ffd42a;
  transform:rotate(-7deg);
  text-align:center;
}

/* ===== responsive ===== */
@media(max-width:900px){
  header{height:69px;padding:5px 9px;border-bottom-width:4px}
  .logo-orb{width:45px;height:45px;border-width:3px}
  .brand{font-size:25px}
  .brand-sub{font-size:7px;letter-spacing:1px}
  nav{display:none}
  .hero{height:470px}
  .character{left:-17%;width:91%;height:790px;bottom:-185px}
  .mode-tag{left:8px;top:10px;font-size:25px;padding:10px 28px 10px 17px}
  .mode-tag span{font-size:9px}
  .hero-copy{right:3%;top:70px;width:48%}
  .bubble{font-size:22px;padding:21px 14px;border-width:5px}
  .hero-sfx{font-size:43px;-webkit-text-stroke-width:2px}
  .hero-status{right:8px;bottom:8px;font-size:8px;padding:5px 7px}
  .feed{padding:0 9px 20px}
  .feed-head{margin:0 -9px;min-height:69px;padding:7px 11px;border-width:0 0 4px}
  .feed-orb{width:40px;height:40px;border-width:3px}
  .feed-title{font-size:30px}
  .count{font-size:15px;padding:4px 11px;border-width:3px}
  .toggle{font-size:9px;margin-left:3px}
  .updated{font-size:8px}
  .feed-item{
    min-height:105px;
    grid-template-columns:55px 1fr 72px;
    gap:7px;
    padding:8px 7px;
    border-width:4px;
    box-shadow:5px 5px 0 #000;
  }
  .feed-item>div:nth-child(2){grid-column:2/4}
  .feed-item .badge{grid-row:1/3;width:47px;height:47px;font-size:20px;border-width:3px;box-shadow:3px 3px 0 #000,0 0 0 2px #fff,0 0 0 4px #050505}.feed-item .badge:before{inset:-8px}
  .feed-item .item-right{grid-column:3;grid-row:1/3}
  .pill{font-size:9px;padding:5px 7px;border-width:2px;box-shadow:3px 3px 0 #000}
  .item-title{font-size:13px;margin-top:6px}
  .item-sub{font-size:8px;margin-top:5px}
  .sfx{font-size:20px}
  .item-time{font-size:8px}
  .level-strip{grid-template-columns:90px 1fr 58px;min-height:100px;gap:6px;padding:8px;border-width:4px}
  .level-strip:before{width:110px}
  .level-label{font-size:14px}
  .level-label small{font-size:7px}
  .level-body{font-size:11px}
  .level-body span{font-size:8px}
  .level-sfx{font-size:21px}
}
@media(max-width:430px){
  .hero{height:430px}
  .character{left:-27%;width:108%;height:740px;bottom:-175px;object-position:center 18%}
  .hero-copy{top:63px;width:49%}
  .bubble{font-size:20px}
  .hero-sfx{font-size:35px}
  .feed-title{font-size:27px}
  .updated{display:none}
  .toggle{margin-left:auto}
  .feed-item{grid-template-columns:49px 1fr 67px}
  .feed-item .badge{width:42px;height:42px}
}
</style>
